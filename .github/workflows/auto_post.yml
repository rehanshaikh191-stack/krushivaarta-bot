name: Krushivaarta Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # दररोज सकाळी ६ वाजता स्वयंचलित रन होईल

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4 pandas google-auth google-auth-oauthlib google-api-python-client

    - name: Run Market Data Sync Script
      run: |
        python krushivaarta_sync.py

    - name: Run Blogger Post Script
      env:
        BLOG_ID: ${{ secrets.BLOG_ID }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      run: |
        python post_blog.py
