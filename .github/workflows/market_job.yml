name: Evening Market Rate Post

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *' # UTC प्रमाणे दुपारी १:०० वाजता (म्हणजे भारतीय वेळेनुसार संध्याकाळी ६:३० वाजता)

jobs:
  market-job:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - run: pip install requests beautifulsoup4 pandas google-auth google-auth-oauthlib google-api-python-client
    - name: Run Market Data Sync Script
      run: python krushivaarta_sync.py
    - name: Run Market Post Script
      env:
        BLOG_ID: ${{ secrets.BLOG_ID }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        SHEET_SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      run: python post_market.py
